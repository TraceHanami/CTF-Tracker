<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Event Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0d1a;
      --surface: #111629;
      --surface2: #1a2040;
      --border: #252d4a;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --active: #00d4aa;
      --text: #e8ecf5;
      --muted: #7b8ab8;
      --tag-bg: #1e2848;
      --tag-text: #9daee8;
      --danger: #ff4e6a;
      --warn: #ffb84d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* ── Header ── */
    .header {
      max-width: 960px;
      margin: 0 auto 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-left h1 {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6c63ff, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .header-left p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Stats Bar ── */
    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 20px;
      text-align: center;
      min-width: 110px;
    }
    .stat-chip .val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .stat-chip .lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }
    .stat-chip.accent .val { color: var(--accent); }

    /* ── Grid ── */
    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      position: relative;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.3s;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(108,99,255,0.06), transparent 60%);
      pointer-events: none;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .card.participating {
      border-color: var(--active);
      box-shadow: 0 0 0 1px var(--active), 0 8px 32px rgba(0,212,170,0.15);
    }
    .card.participating::before {
      background: linear-gradient(135deg, rgba(0,212,170,0.08), transparent 60%);
    }

    /* participating ribbon */
    .ribbon {
      position: absolute;
      top: 14px; right: -28px;
      background: var(--active);
      color: #0a0d1a;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 36px;
      transform: rotate(35deg);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card.participating .ribbon { opacity: 1; }

    /* Card header row */
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    /* Checkbox */
    .check-wrap { display: flex; align-items: center; padding-top: 2px; }
    .check-wrap input[type=checkbox] { display: none; }
    .check-wrap label {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .check-wrap input:checked + label {
      border-color: var(--active);
      background: var(--active);
    }
    .check-wrap label::after {
      content: '';
      width: 5px; height: 9px;
      border: 2px solid #0a0d1a;
      border-top: none; border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .check-wrap input:checked + label::after { opacity: 1; }

    /* Team info */
    .team-info { flex: 1; min-width: 0; }
    .team-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }
    .team-lead {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .team-lead span {
      color: var(--accent);
      font-weight: 500;
    }

    /* Members section */
    .members-section { margin-top: 12px; }
    .members-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }
    .card.participating .tag {
      background: rgba(0,212,170,0.1);
      border-color: rgba(0,212,170,0.3);
      color: #6fffd8;
    }

    /* Edit button */
    .btn-edit {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.1); }

    /* Edit Mode */
    .edit-panel { display: none; flex-direction: column; gap: 10px; margin-top: 8px; }
    .edit-panel.open { display: flex; }

    /* Custom Multi-Select Dropdown */
    .dropdown-wrap { position: relative; }
    .dropdown-trigger {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
      user-select: none;
    }
    .dropdown-trigger:hover, .dropdown-trigger.open { border-color: var(--accent); }
    .dropdown-trigger .arrow {
      font-size: 0.6rem;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .dropdown-trigger.open .arrow { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 6px;
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .dropdown-menu.open { display: block; }
    .dropdown-menu::-webkit-scrollbar { width: 4px; }
    .dropdown-menu::-webkit-scrollbar-track { background: transparent; }
    .dropdown-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .dropdown-search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 0.76rem;
      margin-bottom: 6px;
      outline: none;
    }
    .dropdown-search:focus { border-color: var(--accent); }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.77rem;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .dropdown-item:hover { background: rgba(108,99,255,0.12); color: var(--text); }
    .dropdown-item.selected { background: rgba(0,212,170,0.12); color: var(--active); }
    .dropdown-item .item-check {
      width: 14px; height: 14px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 0.6rem;
    }
    .dropdown-item.selected .item-check {
      background: var(--active);
      border-color: var(--active);
      color: #0a0d1a;
    }

    /* Selected preview tags in edit mode */
    .selected-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 24px;
    }
    .sel-tag {
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.4);
      color: #b0a8ff;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sel-tag .rm {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1;
      transition: color 0.15s;
    }
    .sel-tag .rm:hover { color: var(--danger); }

    /* Action buttons */
    .edit-actions { display: flex; gap: 8px; }
    .btn-save {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), #8b85ff);
      border: none;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.76rem;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }

    /* No members empty state */
    .no-members {
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
    }

    /* Pulse animation for active card */
    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 1px var(--active), 0 8px 32px rgba(0,212,170,0.1); }
      50% { box-shadow: 0 0 0 1px var(--active), 0 8px 32px rgba(0,212,170,0.25); }
    }
    .card.participating { animation: pulse-border 2.5s ease-in-out infinite; }

    /* Tooltip on team name */
    [title] { cursor: default; }

    /* Responsive */
    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <h1>⚡ Team Event Dashboard</h1>
    <p>Manage team participation &amp; rosters for the event</p>
  </div>
  <div class="stats-bar">
    <div class="stat-chip">
      <div class="val" id="stat-participating">0</div>
      <div class="lbl">Participating</div>
    </div>
    <div class="stat-chip accent">
      <div class="val" id="stat-total">0</div>
      <div class="lbl">Total Teams</div>
    </div>
    <button onclick="openAddTeamModal()" style="background:linear-gradient(135deg, #6c63ff, #8b85ff); border:none; color:#fff; font-size:0.82rem; font-weight:600; padding:10px 18px; border-radius:12px; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:0 4px 15px rgba(108,99,255,0.3); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='none'">➕ Add Team</button>
  </div>
</div>

<!-- Cards Grid -->
<div class="grid" id="grid"></div>

<!-- Modal for Adding New Team -->
<div id="addTeamModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:18px; width:100%; max-width:440px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,0.8);">
    <h3 style="margin-bottom:16px; font-size:1.2rem; font-weight:700; color:var(--text)">➕ Create New Team</h3>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:0.75rem; color:var(--muted); font-weight:600;">TEAM NAME</label>
        <input id="newTeamName" type="text" placeholder="e.g. Cyber_Wolves" style="width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; margin-top:4px; font-size:0.85rem;" />
      </div>
      <div>
        <label style="font-size:0.75rem; color:var(--muted); font-weight:600;">TEAM LEAD</label>
        <input id="newTeamLead" type="text" placeholder="e.g. Alex Smith" style="width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; margin-top:4px; font-size:0.85rem;" />
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button onclick="closeAddTeamModal()" style="background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 16px; border-radius:8px; cursor:pointer;">Cancel</button>
      <button onclick="submitAddTeam()" style="background:var(--accent); border:none; color:#fff; padding:8px 18px; border-radius:8px; font-weight:600; cursor:pointer;">Create Team</button>
    </div>
  </div>
</div>

<script>
const POOL = [
  "Liyandar Rishwanth .L","Kowshik. T","Vishal .R","Rithish .S .G",
  "Keerthi Raghavan .K","Santhosh Kumar. S","Abhinesh John .V","Nirmal Raj .D",
  "Harish Kumar. N","Kadhiravan. E. G","Vaishnavan .S","Harish Kumar .V .S",
  "Christ Michael Jeniston. S","Mantraa .K","Sree Murugan .N .M","Pranesh .C",
  "Jeevaranjan. V","Karan .R .J","Asuwath Kumaresh .V","Mihaash Dharan. M",
  "Jesvin Bruce. J","Harish. M","Dharshini .T .R","Jashwanth .M .U"
];

let teams = [];
let drafts = {};
let nameDrafts = {};
let leadDrafts = {};
let editOpen = {};
let dropOpen = {};

async function loadTeamsFromAPI() {
  try {
    const res = await fetch('/api/teams');
    const d = await res.json();
    if (d.success && d.teams) {
      teams = d.teams;
    }
  } catch (e) {
    console.error('Failed to load teams:', e);
  }
  render();
}

function updateStats() {
  const count = teams.filter(t => t.participating).length;
  document.getElementById('stat-participating').textContent = count;
  document.getElementById('stat-total').textContent = teams.length;
}

function renderTags(members) {
  if (!members || !members.length) return `<span class="no-members">No members assigned</span>`;
  return `<div class="tags">${members.map(m => `<span class="tag">${m}</span>`).join('')}</div>`;
}

function renderSelTags(draft, teamId) {
  if (!draft || !draft.length) return `<span class="no-members" style="font-size:0.72rem">None selected</span>`;
  return draft.map(m =>
    `<span class="sel-tag">${m}<span class="rm" onclick="removeDraftMember(${teamId},'${CSS.escape ? m.replace(/'/g,"\\'") : m}')">✕</span></span>`
  ).join('');
}

function renderDropdownItems(teamId) {
  const draft = drafts[teamId] || [];
  const search = (document.getElementById(`search-${teamId}`)?.value || '').toLowerCase();
  return POOL
    .filter(p => !search || p.toLowerCase().includes(search))
    .map(p => {
      const sel = draft.includes(p);
      return `<div class="dropdown-item ${sel?'selected':''}" onclick="toggleMember(${teamId},'${p.replace(/'/g,"\\'")}')">
        <span class="item-check">${sel?'✓':''}</span>${p}
      </div>`;
    }).join('');
}

function buildCard(t) {
  const editing = editOpen[t.id];
  const draft = drafts[t.id] || [...t.members];
  const dOpen = dropOpen[t.id];

  return `
  <div class="card ${t.participating?'participating':''}" id="card-${t.id}">
    <div class="ribbon">ACTIVE</div>
    <div class="card-header">
      <div class="check-wrap">
        <input type="checkbox" id="chk-${t.id}" ${t.participating?'checked':''} onchange="toggleParticipating(${t.id})"/>
        <label for="chk-${t.id}"></label>
      </div>
      <div class="team-info">
        <div class="team-name" title="${t.team}">${t.team}</div>
        <div class="team-lead">Lead: <span>${t.lead}</span></div>
      </div>
    </div>

    <div class="members-section">
      <div class="members-label">
        <span>Members (${editing ? draft.length : t.members.length})</span>
        ${!editing
          ? `<button class="btn-edit" onclick="openEdit(${t.id})">✏ Edit Team</button>`
          : ''}
      </div>

      ${!editing
        ? renderTags(t.members)
        : `<div class="edit-panel open">
            <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px;">
              <input id="edit-name-${t.id}" type="text" value="${t.team}" placeholder="Team Name" style="background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:0.8rem;" />
              <input id="edit-lead-${t.id}" type="text" value="${t.lead}" placeholder="Team Lead" style="background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:0.8rem;" />
            </div>
            <div class="selected-preview" id="preview-${t.id}">${renderSelTags(draft, t.id)}</div>
            <div class="dropdown-wrap">
              <div class="dropdown-trigger ${dOpen?'open':''}" id="trigger-${t.id}" onclick="toggleDrop(${t.id})">
                <span style="color:var(--muted);font-size:0.76rem">Select members from pool…</span>
                <span class="arrow">▼</span>
              </div>
              <div class="dropdown-menu ${dOpen?'open':''}" id="menu-${t.id}">
                <input class="dropdown-search" id="search-${t.id}" type="text" placeholder="Search..." oninput="refreshItems(${t.id})"/>
                <div id="items-${t.id}">${renderDropdownItems(t.id)}</div>
              </div>
            </div>
            <div class="edit-actions" style="display:flex; justify-content:space-between; width:100%; margin-top:8px;">
              <div style="display:flex; gap:6px;">
                <button class="btn-save" onclick="saveEdit(${t.id})">✓ Save</button>
                <button class="btn-cancel" onclick="cancelEdit(${t.id})">✕ Cancel</button>
              </div>
              <button onclick="deleteTeam(${t.id})" style="background:rgba(255,78,106,0.15); border:1px solid var(--danger); color:var(--danger); font-size:0.7rem; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer;">🗑 Delete</button>
            </div>
          </div>`
      }
    </div>
  </div>`;
}

function render() {
  document.getElementById('grid').innerHTML = teams.map(buildCard).join('');
  updateStats();
}

async function toggleParticipating(id) {
  const team = teams.find(t => t.id === id);
  if (!team) return;
  team.participating = !team.participating;
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle('participating', team.participating);
  updateStats();
  try {
    await fetch(`/api/teams/${id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ participating: team.participating })
    });
  } catch(e) {}
}

function openEdit(id) {
  const team = teams.find(t => t.id === id);
  editOpen[id] = true;
  drafts[id] = [...(team ? team.members : [])];
  dropOpen[id] = false;
  reRenderCard(id);
}

function cancelEdit(id) {
  editOpen[id] = false;
  delete drafts[id];
  dropOpen[id] = false;
  reRenderCard(id);
}

async function saveEdit(id) {
  const team = teams.find(t => t.id === id);
  if (!team) return;

  const nameVal = document.getElementById(`edit-name-${id}`)?.value.strip ? document.getElementById(`edit-name-${id}`).value.trim() : team.team;
  const leadVal = document.getElementById(`edit-lead-${id}`)?.value ? document.getElementById(`edit-lead-${id}`).value.trim() : team.lead;
  const membersVal = [...(drafts[id] || team.members)];

  team.team = nameVal || team.team;
  team.lead = leadVal || team.lead;
  team.members = membersVal;

  editOpen[id] = false;
  delete drafts[id];
  dropOpen[id] = false;
  reRenderCard(id);

  try {
    await fetch(`/api/teams/${id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ team: team.team, lead: team.lead, members: team.members })
    });
  } catch(e) {}
}

async function deleteTeam(id) {
  if (!confirm("Are you sure you want to delete this team?")) return;
  teams = teams.filter(t => t.id !== id);
  render();
  try {
    await fetch(`/api/teams/${id}`, { method: 'DELETE' });
  } catch(e) {}
}

function openAddTeamModal() {
  document.getElementById('addTeamModal').style.display = 'flex';
}

function closeAddTeamModal() {
  document.getElementById('addTeamModal').style.display = 'none';
  document.getElementById('newTeamName').value = '';
  document.getElementById('newTeamLead').value = '';
}

async function submitAddTeam() {
  const name = document.getElementById('newTeamName').value.trim();
  const lead = document.getElementById('newTeamLead').value.trim();
  if (!name) { alert("Please enter a team name."); return; }

  try {
    const res = await fetch('/api/teams', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ team: name, lead: lead || "Team Lead", members: [], participating: false })
    });
    const d = await res.json();
    if (d.success && d.teams) {
      teams = d.teams;
    } else {
      teams.push({ id: Date.now(), team: name, lead: lead || "Team Lead", members: [], participating: false });
    }
  } catch(e) {
    teams.push({ id: Date.now(), team: name, lead: lead || "Team Lead", members: [], participating: false });
  }
  closeAddTeamModal();
  render();
}

function toggleDrop(id) {
  dropOpen[id] = !dropOpen[id];
  const trigger = document.getElementById(`trigger-${id}`);
  const menu = document.getElementById(`menu-${id}`);
  if (trigger) trigger.classList.toggle('open', dropOpen[id]);
  if (menu) menu.classList.toggle('open', dropOpen[id]);
  if (dropOpen[id]) setTimeout(() => document.getElementById(`search-${id}`)?.focus(), 50);
}

function toggleMember(id, name) {
  if (!drafts[id]) {
    const team = teams.find(t => t.id === id);
    drafts[id] = [...(team ? team.members : [])];
  }
  const idx = drafts[id].indexOf(name);
  if (idx === -1) drafts[id].push(name);
  else drafts[id].splice(idx, 1);

  const preview = document.getElementById(`preview-${id}`);
  if (preview) preview.innerHTML = renderSelTags(drafts[id], id);
  refreshItems(id);
}

function removeDraftMember(id, name) {
  toggleMember(id, name);
}

function refreshItems(id) {
  const el = document.getElementById(`items-${id}`);
  if (el) el.innerHTML = renderDropdownItems(id);
}

function reRenderCard(id) {
  const team = teams.find(t => t.id === id);
  const card = document.getElementById(`card-${id}`);
  if (!card || !team) { render(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = buildCard(team);
  card.replaceWith(tmp.firstElementChild);
}

loadTeamsFromAPI();
</script>
</body>
</html>
